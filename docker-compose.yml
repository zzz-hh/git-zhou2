version: '3'
services:
  node0:
    image: ${REGISTRY:-docker.io}/fediux/fediux-node:${TAG:-latest}
    restart: "always"
    container_name: fediux-node0
    # ports:
    #   - "50050:50050"
    volumes:
      # - ./config:/app/config
      - ./data:/app/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "GLOG_logtostderr=1 GLOG_v=2 ./fediux-node --node_id=node0 --config=/app/config/fediux_node0.yaml"
    # GLOG_v 0->7,the larger the value the more detailed the log
    depends_on:
      meta0:
        condition: service_healthy

  node1:
    image: ${REGISTRY:-docker.io}/fediux/fediux-node:${TAG:-latest}
    restart: "always"
    container_name: fediux-node1
    # ports:
    #   - "50051:50051"
    volumes:
      # - ./config:/app/config
      - ./data:/app/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "GLOG_logtostderr=1 GLOG_v=2 ./fediux-node --node_id=node1 --config=/app/config/fediux_node1.yaml"
    depends_on:
      meta1:
        condition: service_healthy

  node2:
    image: ${REGISTRY:-docker.io}/fediux/fediux-node:${TAG:-latest}
    restart: "always"
    container_name: fediux-node2
    # ports:
    #   - "50052:50052"
    volumes:
      # - ./config:/app/config
      - ./data:/app/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "GLOG_logtostderr=1 GLOG_v=2 ./fediux-node --node_id=node2 --config=/app/config/fediux_node2.yaml"
    depends_on:
      meta2:
        condition: service_healthy

  meta0:
    image: ${REGISTRY:-docker.io}/fediux/fediux-meta:${TAG:-latest}
    restart: "always"
    container_name: fediux-meta0
    # ports:
    #   - "7977:9099"
    # volumes:
    #   - ./data:/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "java -jar /applications/meta-simple.jar \
        --server.port=8088 \
        --grpc.server.port=9099 \
        --db.path=/data/meta_service/node0 \ 
        --collaborate=http://fediux-meta1:8088/,http://fediux-meta2:8088/"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q http://localhost:8088/health"]
      interval: 8s
      timeout: 3s
      retries: 3

  meta1:
    image: ${REGISTRY:-docker.io}/fediux/fediux-meta:${TAG:-latest}
    restart: "always"
    container_name: fediux-meta1
    # ports:
    #   - "7977:9099"
    # volumes:
    #   - ./data:/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "java -jar /applications/meta-simple.jar \
        --server.port=8088 \
        --grpc.server.port=9099 \
        --db.path=/data/meta_service/node1 \ 
        --collaborate=http://fediux-meta0:8088/,http://fediux-meta2:8088/"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q http://localhost:8088/health"]
      interval: 8s
      timeout: 3s
      retries: 3

  meta2:
    image: ${REGISTRY:-docker.io}/fediux/fediux-meta:${TAG:-latest}
    restart: "always"
    container_name: fediux-meta2
    # ports:
    #   - "7977:9099"
    # volumes:
    #   - ./data:/data
    entrypoint:
      - "/bin/bash"
      - "-c"
      - "java -jar /applications/meta-simple.jar \
        --server.port=8088 \
        --grpc.server.port=9099 \
        --db.path=/data/meta_service/node2 \
        --collaborate=http://fediux-meta0:8088/,http://fediux-meta1:8088/"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q http://localhost:8088/health"]
      interval: 8s
      timeout: 3s
      retries: 3

networks:
  fediux_net:
